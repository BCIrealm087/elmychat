name: CI

on:
  push:
    branches: [codex-startup]
  pull_request:
    branches: [codex-startup]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --no-shell ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - run: npm run check:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feasibility-${{ matrix.os }}
          path: .runtime/proof/
          if-no-files-found: ignore
