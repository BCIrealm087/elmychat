<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elmychat native pair proof</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; pointer-events: none; }
    p { margin: 16px; color: white; background: #18181b; padding: 16px; font: 16px system-ui; }
  </style>
</head>
<body>
  <script>
    const params = new URLSearchParams(location.search);
    const twitch = params.get('twitch');
    const youtube = params.get('youtube');
    if (!/^[a-zA-Z0-9_]{1,25}$/.test(twitch ?? '') || !/^[a-zA-Z0-9_-]{11}$/.test(youtube ?? '')) {
      const message = document.createElement('p');
      message.textContent = 'Native proof requires ?twitch=CHANNEL&youtube=VIDEO_ID. This page contains no simulated chat.';
      document.body.append(message);
    } else {
      const urls = [
        `https://www.twitch.tv/embed/${twitch}/chat?parent=${encodeURIComponent(location.hostname)}`,
        `https://www.youtube.com/live_chat?v=${youtube}&embed_domain=${encodeURIComponent(location.hostname)}`,
      ];
      for (const [i, src] of urls.entries()) {
        const frame = document.createElement('iframe');
        frame.src = src;
        frame.title = i === 0 ? 'Native Twitch chat' : 'Native YouTube live chat';
        document.body.append(frame);
      }
    }
  </script>
</body>
</html>
