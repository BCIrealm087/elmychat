<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elmychat starter overlay</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body { font: 16px system-ui, sans-serif; }
      .status { position: absolute; bottom: 16px; left: 16px; margin: 0; padding: 12px 16px; color: #f4f4f5; background: #18181be6; border-radius: 8px; }
      .status strong { display: block; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <p class="status" role="status">
      <strong>Elmychat — project foundation</strong>
      Native Twitch and YouTube chats are not connected yet.
    </p>
  </body>
</html>
